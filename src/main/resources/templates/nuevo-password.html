<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body data-spy="scroll" data-target=".navbar" data-offset="50">


<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>



<!-- Login section -->
<section class="login-section">
    <div class="container">
        <div class="row">


            <div class="col-lg-12 contact-info scrolli d-flex justify-content-center">
                <div class="card bg-gray text-center p-5">

                    <h2 class="font-weight-bold m-3 sombra-texto" style="color: #1e29a4;animation: 5s infinite pulse;">RESTABLECER PASSWORD</h2>

                    <img th:src="@{/img/nuevo-password.png}" class="img-fluid mx-auto" width="200px">

                    <form class="contact-form" th:action="@{/reestablecer-password/}+${idUsuario}+@{/}+${token}" method="post">

                        <input type="password" placeholder="Nuevo Password" name="password" required class="form__input">
                        <input type="password" placeholder="Verifica Password" name="repetirPassword" required class="form__input">
                        <button class="site-btn button btn-block" type="submit">Enviar</button>

                    </form>

                </div>
            </div>


        </div>
    </div>


</section>
<!-- Contact section end -->



<div th:replace="plantilla/template :: modal"/>
<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
