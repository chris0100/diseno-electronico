<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body data-spy="scroll" data-target=".navbar" data-offset="50">


<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<section class="super-section">



    <nav th:replace="plantilla/menu-panel-admin :: menu-panel-admin"/>



    <div class="container">


        <div class="text-center" style="margin-top: 100px">
            <div class="section-title" style="color: #1e29a4;animation: 5s infinite pulse;">
                <h2 class="font-weight-bold sombra-texto">CAMBIAR PASSWORD</h2>
            </div>
        </div>


        <nav aria-label="breadcrumb">
            <ol class="breadcrumb site-pagination">
                <li class="breadcrumb-item"> <a th:href="@{/panel-admin}">Panel</a></li>
                <li class="breadcrumb-item active" aria-current="page">Cambiar Password</li>
            </ol>
        </nav>

        <hr>


        <form class="contact-form" th:action="@{/panel-admin/cambiar-password-admin}"  method="post">

            <div class="campo d-flex justify-content-center align-items-center" >
                <label class="label-pago">Password Anterior</label>
                <input type="password" placeholder="Password Actual" name="actualPassword" class="form__input w-75"  >
            </div>

            <div class="campo d-flex justify-content-center align-items-center" >
                <label class="label-pago">Password Nuevo</label>
                <input type="password" placeholder="Password Nuevo" name="nuevoPassword" class="form__input w-75">
            </div>


            <div class="row">
                <div class="text-right col-8">
                    <button class="site-btn button" type="submit">GUARDAR CAMBIOS</button>
                </div>
            </div>

        </form>

    </div>
</section>




<div th:replace="plantilla/template :: modal"/>
<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
