<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body data-spy="scroll" data-target=".navbar" data-offset="50">


<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<section class="admin-section">

    <div class="container">

        <div th:replace="plantilla/menu-panel-clientes :: menu-panel-clientes"/>


        <div class="text-center mt-5 mb-1">
            <div class="section-title" style="color: #1e29a4;animation: 5s infinite pulse;">
                <h2 class="font-weight-bold sombra-texto">DIRECCIÓN DE ENVIO</h2>
            </div>

            <div>
                <p class="sombra-texto">Revisa y modifica tu dirección de envio</p>
            </div>
        </div>

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb site-pagination">
                <li class="breadcrumb-item"> <a th:href="@{/panel-cliente}">Panel</a></li>
                <li class="breadcrumb-item active" aria-current="page">Dirección</li>
            </ol>
        </nav>

        <hr>

        <div class="d-flex justify-content-center">

            <form class="row address-inputs contact-form w-75" method="post" th:action="@{/panel-cliente/agregar-direccion-cliente}">

                <input type="hidden" name="id" th:value="${direccionUsuario.id}">



                <div class="col-md-12">
                    <div class="form-group">
                        <label class="label-pago">Nombre</label>
                        <input type="text" placeholder="Nombre Completo" name="nombre" class="form-control" th:value="${direccionUsuario.nombre}">
                    </div>

                    <div class="from-group">
                        <label class="label-pago">Dirección</label>
                        <input type="text" placeholder="Dirección" name="direccion" class="form-control" th:value="${direccionUsuario.direccion}">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-grupo">
                        <label class="label-pago">Telefono</label>
                        <input type="text" placeholder="Telefono" name="telefono" class="form-control" th:value="${direccionUsuario.telefono}">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="label-pago">Codigo Postal</label>
                        <input type="text" placeholder="Codigo Postal" name="codigoPostal" class="form-control" th:value="${direccionUsuario.codigoPostal}">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="label-pago">Departamento</label>
                        <input type="text" placeholder="Departamento" name="departamento" class="form-control" th:value="${direccionUsuario.departamento}">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="label-pago">Ciudad</label>
                        <input type="text" placeholder="Ciudad" name="ciudad" class="form-control" th:value="${direccionUsuario.ciudad}">
                    </div>
                </div>


                <div class="col-12 d-flex justify-content-center">
                    <button class="site-btn button" type="submit">GUARDAR CAMBIOS</button>
                </div>

            </form>

        </div>


    </div>


</section>




<div th:replace="plantilla/template :: modal"/>
<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
