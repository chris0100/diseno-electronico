<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body data-spy="scroll" data-target=".navbar" data-offset="50">


<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<section class="admin-section">
    <div class="container">

        <div th:replace="plantilla/menu-panel-clientes :: menu-panel-clientes"/>



        <div class="text-center mt-5 mb-1">
            <div class="section-title" style="color: #1e29a4;animation: 5s infinite pulse;">
                <h2 class="font-weight-bold sombra-texto">CAMBIAR IMAGEN DE PERFIL</h2>
            </div>

            <div>
                <p class="sombra-texto">Carga la imagen de perfil que se mostrara junto a tu nombre y biografia</p>
            </div>
        </div>

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb site-pagination">
                <li class="breadcrumb-item"> <a th:href="@{/panel-cliente}">Panel</a></li>
                <li class="breadcrumb-item active" aria-current="page">Imagen de Perfil</li>
            </ol>
        </nav>

        <hr>


        <div class="row d-flex justify-content-center mb-2">
            <img th:if="${#strings.contains(usuario.imagen, 'loginImage')}" th:src="@{/img/loginImage.png}" class="img-fluid" width="200px">
            <img th:unless="${#strings.contains(usuario.imagen, 'loginImage')}" th:src="@{'/panel-cliente/uploads/'+ ${usuario.imagen}}" class="img-fluid rounded-circle" width="200px">
        </div>


        <form enctype="multipart/form-data" method="post" th:action="@{/panel-cliente/cargar-imagen-cliente}">
            <div class="campo d-flex justify-content-center align-items-center mb-4">
                <label class="label-pago">Imagen</label>
                <input type="file" name="file" class="form-imagen" width="200px">
            </div>


            <div class="row d-flex justify-content-center">
                <button class="site-btn button">SUBIR IMAGEN</button>
            </div>
        </form>


    </div>


</section>




<div th:replace="plantilla/template :: modal"/>
<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
