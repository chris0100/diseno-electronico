<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantilla/template :: common-header"/>

<body data-spy="scroll" data-target=".navbar" data-offset="50">


<!-- barra de navegacion-->
<div th:replace="plantilla/template :: navbar"/>

<!-- Crear cuenta section -->
<section class="registro-section">
    <div class="container">
        <div class="row">

            <div class="col-lg-12 contact-info scrolli d-flex justify-content-center">
                <div class="card bg-gray text-center p-5">

                    <h2 class="font-weight-bold m-3 sombra-texto" style="color: #1e29a4;animation: 5s infinite pulse;">CREA TU CUENTA</h2>



                    <img th:src="@{/img/crearCuenta.png}" class="img-fluid mx-auto" width="200px">
                    <form class="contact-form" th:action="@{/registro}" method="post">

                        <input type="email" placeholder="Tu Email" name="username" class="form__input" th:value="${usuario.username}">
                        <input type="text" placeholder="Tu Nombre" name="nombre" class="form__input" th:value="${usuario.nombre}">
                        <input type="password" placeholder="Tu Password" name="password" class="form__input" th:value="${usuario.password}">
                        <input type="password" placeholder="Repite tu Password" name="repetirPassword" class="form__input" >

                        <button class="site-btn button btn-block">CREAR CUENTA</button>

                    </form>
                </div>
            </div>


        </div>
    </div>


</section>
<!-- Contact section end -->



<div th:replace="plantilla/template :: modal"/>
<footer th:replace="plantilla/template :: footer"/>
<div th:replace="plantilla/template :: body-bottom-scripts"/>

</body>
</html>
